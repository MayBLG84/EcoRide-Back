services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile

        container_name: ecoride_app

        restart: unless-stopped

        working_dir: /var/www/html

        env_file:
            - docker.env

        volumes:
            - ./:/var/www/html
            - /var/www/html/vendor

        depends_on:
            mysql:
                condition: service_healthy
            mongo:
                condition: service_started

        networks:
            - ecoride_network

    nginx:
        image: nginx:latest

        container_name: ecoride_nginx

        restart: unless-stopped

        ports:
            - "8000:80"

        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

        depends_on:
            - app

        networks:
            - ecoride_network

    mysql:
        image: mysql:8.0

        container_name: ecoride_mysql

        restart: unless-stopped

        env_file:
            - docker.env

        ports:
            - "3306:3306"

        command: --default-authentication-plugin=mysql_native_password

        volumes:
            - mysql_data:/var/lib/mysql

        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5

        networks:
            - ecoride_network

    mongo:
        image: mongo:7

        container_name: ecoride_mongo

        restart: unless-stopped

        env_file:
            - docker.env

        ports:
            - "27017:27017"

        volumes:
            - mongo_data:/data/db

        healthcheck:
            test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
            interval: 10s
            timeout: 5s
            retries: 5

        networks:
            - ecoride_network

    phpmyadmin:
        image: phpmyadmin/phpmyadmin

        container_name: ecoride_phpmyadmin

        restart: unless-stopped

        env_file:
            - docker.env

        ports:
            - "8080:80"

        environment:
            PMA_HOST: mysql

        depends_on:
            - mysql

        networks:
            - ecoride_network

    mailhog:
        image: mailhog/mailhog

        container_name: ecoride_mailhog

        restart: unless-stopped

        env_file:
            - docker.env

        ports:
            - "1025:1025"
            - "8025:8025"

        networks:
            - ecoride_network

volumes:
    mysql_data:
    mongo_data:

networks:
    ecoride_network:
        driver: bridge
